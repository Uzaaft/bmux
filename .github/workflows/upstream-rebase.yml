name: 'Upstream Rebase'

on:
  schedule:
    - cron: '21 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-rebase
  cancel-in-progress: true

env:
  REBASE_BRANCH: auto/upstream-rebase

jobs:
  rebase:
    runs-on: ubuntu-latest
    if: github.repository == 'Uzaaft/bmux'
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: fetch upstream
        run: |
          git remote add upstream https://github.com/tmux/tmux.git
          git fetch upstream master

      - name: check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'master already contains upstream/master, nothing to do' >>"$GITHUB_STEP_SUMMARY"
            echo 'skip=true' >>"$GITHUB_OUTPUT"
          else
            behind=$(git rev-list --count HEAD..upstream/master)
            echo "upstream is $behind commits ahead of the fork point" >>"$GITHUB_STEP_SUMMARY"
            echo 'skip=false' >>"$GITHUB_OUTPUT"
          fi

      # Once master contains the upstream tip (a rebase PR was landed), the
      # rebase branch and its PR are stale copies of old history - remove them.
      - name: clean up landed rebase branch
        if: steps.check.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "$REBASE_BRANCH" --base master --state open \
              --json number --jq '.[].number' || true)
          if [ -n "$pr" ]; then
            gh pr close "$pr" --comment 'master now contains upstream/master; closing.' \
              --delete-branch
          elif git ls-remote --exit-code origin "refs/heads/$REBASE_BRANCH" >/dev/null; then
            git push origin --delete "$REBASE_BRANCH"
          fi

      - name: rebase onto upstream/master
        if: steps.check.outputs.skip == 'false'
        run: |
          git checkout -B "$REBASE_BRANCH" master
          if ! git rebase upstream/master; then
            {
              echo '## Rebase conflict'
              echo 'The automatic rebase onto upstream/master stopped on:'
              echo '```'
              git log -1 --format='%h %s' REBASE_HEAD || true
              echo '```'
              echo 'Conflicted files:'
              echo '```'
              git diff --name-only --diff-filter=U
              echo '```'
              echo 'Resolve manually: `git rebase upstream/master` on master, then push.'
            } >>"$GITHUB_STEP_SUMMARY"
            git rebase --abort
            exit 1
          fi

      # Rebasing regenerates commit hashes every run even when nothing changed
      # (committer date differs), so compare trees to avoid force-push and PR
      # churn every 6 hours.
      - name: push rebase branch
        id: push
        if: steps.check.outputs.skip == 'false'
        run: |
          if git fetch origin "$REBASE_BRANCH" 2>/dev/null \
              && [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')" ] \
              && git merge-base --is-ancestor upstream/master FETCH_HEAD; then
            echo 'existing rebase branch is already up to date' >>"$GITHUB_STEP_SUMMARY"
          else
            git push --force origin "$REBASE_BRANCH"
            echo "pushed $(git rev-parse --short HEAD) to $REBASE_BRANCH" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: open or refresh PR
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(git rev-list --count master..upstream/master)
          title="Rebase onto tmux/tmux master ($(git rev-parse --short upstream/master))"
          body=$(cat <<EOF
          Automated rebase of \`master\` onto [tmux/tmux master](https://github.com/tmux/tmux/commits/master) - $count new upstream commits, fork commits replayed on top, rebase only (no merge commits).

          **Do not use the merge button.** This PR rewrites history, so land it by moving \`master\` to this branch:

          ~~~sh
          git fetch origin
          git push --force-with-lease=refs/heads/master origin origin/$REBASE_BRANCH:master
          ~~~

          The next scheduled run closes this PR and deletes the branch once \`master\` contains the upstream tip.

          <details><summary>New upstream commits</summary>

          $(git log --format='- %h %s' master..upstream/master)

          </details>
          EOF
          )
          pr=$(gh pr list --head "$REBASE_BRANCH" --base master --state open \
              --json number --jq '.[].number' || true)
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --head "$REBASE_BRANCH" --base master \
              --title "$title" --body "$body"
          fi
